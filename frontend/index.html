<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/logo.png" />

    <!--
      Loading screen styles. They live here (not in Tailwind) so the screen shows the moment the page
      starts loading, before the site's code has downloaded. Colours match the theme in src/index.css.
      src/lib/splash.ts fades the screen out once the site is ready.
    -->
    <style>
      #splash {
        /* Full window width, scrollbar area included, so the logo does not jump sideways when the
           page's scrollbar appears underneath. */
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100vw;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        background: radial-gradient(circle at 50% 45%, #ffffff 0%, #f6f7fb 60%, #eceffc 100%);
        transition:
          opacity 0.5s ease,
          visibility 0.5s ease;
      }
      #splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
      }

      /* Logo with a soft pulsing halo behind it and a slim spinning ring around it. */
      .splash-mark {
        position: relative;
        display: grid;
        width: 136px;
        height: 136px;
        place-items: center;
      }
      .splash-mark::before {
        content: '';
        position: absolute;
        inset: 16px;
        border-radius: 50%;
        background: rgba(47, 87, 239, 0.1);
        animation: splash-pulse 1.8s ease-out infinite;
      }
      .splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0deg, #2f57ef 140deg, #b966e7 260deg, transparent 360deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
        animation: splash-spin 1.2s linear infinite;
      }
      .splash-logo {
        position: relative;
        width: 88px;
        height: 88px;
        object-fit: contain;
        filter: drop-shadow(0 10px 22px rgba(25, 35, 53, 0.2));
        animation: splash-pop 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* A thin bar with a gradient sliding through it. */
      .splash-bar {
        width: 160px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #e6e3f1;
      }
      .splash-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2f57ef, #b966e7);
        animation: splash-slide 1.2s ease-in-out infinite;
      }

      .splash-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes splash-pop {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes splash-pulse {
        0% {
          opacity: 1;
          transform: scale(0.85);
        }
        100% {
          opacity: 0;
          transform: scale(1.35);
        }
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-mark::before,
        .splash-ring,
        .splash-logo,
        .splash-bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen: the college logo (public/logo.png, the same file as institute.logoUrl). -->
    <div id="splash" role="status">
      <span class="splash-sr-only">Loading</span>
      <div class="splash-mark" aria-hidden="true">
        <div class="splash-ring"></div>
        <img class="splash-logo" src="/logo.png" alt="" />
      </div>
      <div class="splash-bar" aria-hidden="true"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
